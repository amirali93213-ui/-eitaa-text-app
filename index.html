<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قالب‌ساز پیام و متن نگار | مینی‌اپ ایتا</title>
    <!-- لود کردن کتابخانه و SDK رسمی ایتا -->
    <script src="https://eitaa.com/js/webapp.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- هدر برنامک -->
    <header class="bg-indigo-600 text-white p-4 shadow-md text-center">
        <h1 class="text-lg font-bold"><i class="fa-solid fa-wand-magic-sparkles ml-2"></i>قالب‌ساز و جادوی متن ایتا</h1>
        <p id="userStatus" class="text-xs text-indigo-200 mt-1">در حال اتصال به ایتا...</p>
    </header>

    <!-- جایگاه تبلیغات (محل کسب درآمد) -->
    <div class="bg-amber-100 border-b border-amber-200 p-2 text-center text-xs text-amber-800">
        <span class="inline-block bg-amber-200 px-2 py-0.5 rounded text-[10px] font-bold ml-1">تبلیغات</span>
        بنر درآمدزایی (تپسل / یکتانت)
    </div>

    <!-- محتوای اصلی -->
    <main class="container mx-auto p-4 max-w-md flex-grow">
        <div class="mb-4">
            <label for="inputText" class="block text-sm font-medium mb-1 text-slate-700">متن خود را وارد کنید:</label>
            <textarea id="inputText" rows="4" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm bg-white shadow-sm" placeholder="مثلا: سلام بچه‌ها..."></textarea>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-4">
            <button onclick="applyEffect('box')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 p-2.5 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-square"></i> کادر دور متن
            </button>
            <button onclick="applyEffect('line')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 p-2.5 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-bars"></i> خط کشی فانتزی
            </button>
            <button onclick="applyEffect('bold')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 p-2.5 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-bold"></i> حاشیه‌دار مینی‌مال
            </button>
            <button onclick="applyEffect('reverse')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 p-2.5 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1">
                <i class="fa-solid fa-arrows-turn-left"></i> معکوس‌کننده متن
            </button>
        </div>

        <div class="mb-4">
            <label for="outputText" class="block text-sm font-medium mb-1 text-slate-700">نتیجه خروجی:</label>
            <textarea id="outputText" rows="4" readonly class="w-full p-3 border border-slate-300 rounded-xl bg-slate-100 text-sm shadow-inner" placeholder="خروجی اینجا ظاهر می‌شود..."></textarea>
        </div>

        <button onclick="copyResult()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
            <i class="fa-solid fa-copy"></i> کپی کردن متن
        </button>
        
        <div id="copyAlert" class="hidden mt-2 text-center text-emerald-600 text-xs font-medium">متن با موفقیت کپی شد!</div>
    </main>

    <footer class="bg-slate-200 border-t border-slate-300 text-center py-2 text-[11px] text-slate-500">
        مینی‌اپ رسمی ایتا | درآمدزایی مستقل
    </footer>

    <!-- اسکریپت اتصال به SDK ایتا و منطق برنامک -->
    <script>
        // راه‌اندازی و اتصال اولیه به SDK ایتا
        window.addEventListener('DOMContentLoaded', () => {
            if (window.Eitaa && window.Eitaa.WebApp) {
                const eitaaApp = window.Eitaa.WebApp;
                eitaaApp.ready(); // اعلام آمادگی به مینی‌اپ ایتا
                
                // گرفتن اطلاعات کاربر در صورت نیاز
                const user = eitaaApp.initDataUnsafe?.user;
                if (user && user.first_name) {
                    document.getElementById('userStatus').innerText = `خوش آمدی، ${user.first_name}!`;
                } else {
                    document.getElementById('userStatus').innerText = 'متصل به بستر ایتا';
                }

                // فعال‌سازی دکمه بستن یا تنظیمات ظاهری در صورت نیاز
                eitaaApp.expand();
            } else {
                document.getElementById('userStatus').innerText = 'اجرا در محیط وب (خارج از ایتا)';
            }
        });

        function applyEffect(type) {
            const input = document.getElementById('inputText').value;
            let output = '';
            if (!input.trim()) {
                alert('لطفاً ابتدا متنی را وارد کنید.');
                return;
            }
            if (type === 'box') {
                const lines = input.split('\n');
                const framed = lines.map(l => `│ ${l} │`);
                const width = Math.max(...lines.map(l => l.length)) + 4;
                const topBottom = '─'.repeat(width);
                output = `┌${topBottom}┐\n` + framed.join('\n') + `\n└${topBottom}┘`;
            } else if (type === 'line') {
                output = ` 🏲 ⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯ 🏲 ⭞\n${input}\n 🏲 ⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯ 🏲 ⭞`;
            } else if (type === 'bold') {
                output = `╔═❖ محل متن ❖═╗\n${input}\n╚══════════════╝`;
            } else if (type === 'reverse') {
                output = input.split('').reverse().join('');
            }
            document.getElementById('outputText').value = output;
        }

        function copyResult() {
            const outputBox = document.getElementById('outputText');
            if (!outputBox.value) return;
            outputBox.select();
            navigator.clipboard.writeText(outputBox.value);
            const alertBox = document.getElementById('copyAlert');
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 2000);
        }
    </script>
</body>
</html>
